{{- if eq (include "router.gateway_api.enabled" .) "true" }}
{{- include "router.gateway_api.validate" . }}
{{- $config := include "router.gateway_api.config" . | fromYaml }}
apiVersion: {{ $config.api_version }}
kind: HTTPRoute
metadata:
  name: {{ include "router.name" . }}
  {{- with $config.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- if $config.parentRefs }}
    {{- toYaml $config.parentRefs | nindent 4 }}
  {{- else }}
    - name: {{ include "router.gateway_api.gateway.name" . }}
      sectionName: https
  {{- end }}
  hostnames:
    {{- toYaml $config.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "router.name" . }}
          {{- if eq (include "router.use-tls" .) "true" }}
          port: {{ .Values.general.router.service.ports.https }}
          {{- else }}
          port: {{ .Values.general.router.service.ports.http }}
          {{- end }}
      {{- with $config.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
