{{- if eq (include "router.gateway_api.enabled" .) "true" }}
{{- include "router.gateway_api.validate" . }}
{{- $config := include "router.gateway_api.config" . | fromYaml }}
apiVersion: {{ $config.api_version }}
kind: HTTPRoute
metadata:
  name: {{ include "router.name" . }}
  {{- with $config.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "router.gateway_api.parentRefs" . | nindent 4 }}
  hostnames:
    {{- toYaml $config.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "router.name" . }}
          port: {{ include "router.gateway_api.backend_port" . }}
      {{- with $config.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
