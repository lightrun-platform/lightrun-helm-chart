{{- if eq (include "router.gateway_api.backend_tls_policy.enabled" .) "true" }}
{{- $policy := (include "router.gateway_api.config" . | fromYaml).backend_tls_policy }}
{{- if $policy.ca_certificate }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "router.gateway_api.backend_ca.name" . }}
  {{- with $policy.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ca.crt: |
    {{- $policy.ca_certificate | nindent 4 }}
---
{{- end }}
apiVersion: {{ $policy.api_version }}
kind: BackendTLSPolicy
metadata:
  name: {{ include "router.name" . }}
  {{- with $policy.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $policy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "router.name" . }}
  validation:
    hostname: {{ $policy.hostname | quote }}
    {{- include "router.gateway_api.backend_tls_policy.ca" . | nindent 4 }}
    {{- with $policy.subjectAltNames }}
    subjectAltNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
