{{- if eq (include "router.gateway_api.gateway.create" .) "true" }}
{{- $gateway := (include "router.gateway_api.config" . | fromYaml).gateway }}
apiVersion: {{ $gateway.api_version }}
kind: Gateway
metadata:
  name: {{ include "router.gateway_api.gateway.name" . }}
  {{- with $gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gateway.gatewayClassName }}
  {{- with $gateway.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- include "router.gateway_api.gateway.listeners" . | nindent 4 }}
{{- end }}
