{{- $gw := .Values.general.router.gateway_api }}
{{- if eq (include "router.gateway_api.http_redirect.enabled" .) "true" }}
apiVersion: {{ $gw.api_version }}
kind: HTTPRoute
metadata:
  name: {{ include "router.name" . }}-http-redirect
  {{- with $gw.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $gw.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- if $gw.http_redirect.parentRefs }}
    {{- toYaml $gw.http_redirect.parentRefs | nindent 4 }}
  {{- else }}
    - name: {{ include "router.gateway_api.gateway.name" . }}
      sectionName: http
  {{- end }}
  hostnames:
    {{- toYaml ($gw.hostnames | default (list .Values.general.lightrun_endpoint)) | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
