{{- if .Values.deployments.runtime_collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime_collector.headless.name" . }}
  labels:
    app: {{ include "runtime_collector.name" . }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: grpc
      port: {{ .Values.deployments.runtime_collector.server.service.port }}
      targetPort: grpc
      protocol: TCP
  selector:
    app: {{ include "runtime_collector.name" . }}
{{- end }}
