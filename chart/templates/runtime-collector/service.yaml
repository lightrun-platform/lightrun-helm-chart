{{- if .Values.runtime_collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime_collector.name" . }}
  {{- with .Values.runtime_collector.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ include "runtime_collector.name" . }}
    {{- with .Values.runtime_collector.server.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.runtime_collector.server.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.runtime_collector.server.service.port }}
      targetPort: grpc
      protocol: TCP
    - name: management
      port: {{ .Values.runtime_collector.server.service.managementPort }}
      targetPort: management
      protocol: TCP
  selector:
    app: {{ include "runtime_collector.name" . }}
{{- end }}
