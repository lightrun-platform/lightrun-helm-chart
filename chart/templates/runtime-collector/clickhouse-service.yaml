{{- if and .Values.deployments.runtime_collector.enabled .Values.deployments.runtime_collector.clickhouse.local.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime_collector.clickhouse.name" . }}
  {{- with .Values.deployments.runtime_collector.clickhouse.local.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ include "runtime_collector.clickhouse.name" . }}
    {{- with .Values.deployments.runtime_collector.clickhouse.local.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ include "runtime_collector.clickhouse.serviceHttpPort" . }}
      targetPort: http
    - name: native
      port: {{ .Values.deployments.runtime_collector.clickhouse.local.nativePort }}
      targetPort: native
  selector:
    app: {{ include "runtime_collector.clickhouse.name" . }}
{{- end }}
