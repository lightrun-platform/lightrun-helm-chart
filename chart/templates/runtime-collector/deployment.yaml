{{- if .Values.runtime_collector.enabled }}
{{- include "runtime_collector.clickhouse.validateTls" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime_collector.name" . }}
  {{- with .Values.runtime_collector.server.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ include "runtime_collector.name" . }}
    {{- with .Values.runtime_collector.server.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.runtime_collector.server.replicas }}
  strategy:
    type: {{ .Values.runtime_collector.server.rollout_strategy }}
  selector:
    matchLabels:
      app: {{ include "runtime_collector.name" . }}
  template:
    metadata:
      {{- with .Values.runtime_collector.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "runtime_collector.name" . }}
        {{- with .Values.runtime_collector.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.runtime_collector.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.runtime_collector.server.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ template "runtime_collector.serviceAccountName" . }}
      {{- if .Values.runtime_collector.server.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.runtime_collector.server.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.secrets.defaults.dockerhub_config }}
      imagePullSecrets:
      {{- if .Values.secrets.defaults.dockerhub_config.existingSecret }}
        - name: {{ .Values.secrets.defaults.dockerhub_config.existingSecret }}
      {{- else }}
        - name: {{ include "secrets.dockerhub.name" . }}
      {{- end -}}
      {{- end }}
      initContainers:
        - name: wait-for-clickhouse
          image: "{{ .Values.runtime_collector.server.initContainers.wait_for_clickhouse.image.repository }}:{{ .Values.runtime_collector.server.initContainers.wait_for_clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.runtime_collector.server.initContainers.wait_for_clickhouse.image.pullPolicy }}
          securityContext:
            {{- include "runtime_collector.initContainerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.runtime_collector.server.initContainers.wait_for_clickhouse.resources | nindent 12 }}
          {{- if or .Values.general.readOnlyRootFilesystem (include "runtime_collector.clickhouse.ca.mount" .) }}
          volumeMounts:
            {{- if .Values.general.readOnlyRootFilesystem }}
            - name: tmpfs
              mountPath: /tmp
            {{- end }}
            {{- if include "runtime_collector.clickhouse.ca.mount" . }}
            {{- include "runtime_collector.clickhouse.ca.volumeMount" . | nindent 12 }}
            {{- end }}
          {{- end }}
          command:
            - sh
            - -c
            - {{ include "runtime_collector.clickhouse.waitForCommand" . | quote }}
        - name: migrate-clickhouse
          image: "{{ .Values.runtime_collector.server.initContainers.migrations.image.repository }}:{{ .Values.runtime_collector.server.image.tag }}"
          imagePullPolicy: {{ .Values.runtime_collector.server.initContainers.migrations.image.pullPolicy }}
          securityContext:
            {{- include "runtime_collector.initContainerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.runtime_collector.server.initContainers.migrations.resources | nindent 12 }}
          env:
            - name: CLICKHOUSE_HOST
              value: {{ include "runtime_collector.clickhouse.hostname" . | quote }}
            - name: CLICKHOUSE_NATIVE_PORT
              value: {{ include "runtime_collector.clickhouse.nativePort" . | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.runtime_collector.clickhouse.database | quote }}
            - name: CLICKHOUSE_SECURE
              value: {{ include "runtime_collector.clickhouse.nativeSecure" . | default "false" | quote }}
            {{- with include "runtime_collector.clickhouse.cluster" . }}
            - name: CLICKHOUSE_CLUSTER
              value: {{ . | quote }}
            {{- end }}
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime_collector.clickhouse.secretName" . }}
                  key: CLICKHOUSE_USERNAME
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime_collector.clickhouse.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            {{- if include "runtime_collector.clickhouse.ca.mount" . }}
            ## Named SSL_CERT_FILE because `migrate` is a Go binary and builds its trust store
            ## from that variable specifically; the entrypoint reads the same one.
            - name: SSL_CERT_FILE
              value: /tmp/ca-certificates/ca.crt
            {{- end }}
          {{- if or .Values.general.readOnlyRootFilesystem (include "runtime_collector.clickhouse.ca.mount" .) }}
          volumeMounts:
            {{- if .Values.general.readOnlyRootFilesystem }}
            - name: tmpfs
              mountPath: /tmp
            {{- end }}
            {{- if include "runtime_collector.clickhouse.ca.mount" . }}
            {{- include "runtime_collector.clickhouse.ca.volumeMount" . | nindent 12 }}
            {{- end }}
          {{- end }}
          args:
            - -path=/migrations
            - {{ printf "-database=%s" (include "runtime_collector.clickhouse.migrateDatabaseUrl" .) | quote }}
            - up
      containers:
        - name: {{ include "runtime_collector.name" . }}
          securityContext:
            {{- include "runtime_collector.containerSecurityContext" . | nindent 12 }}
          image: "{{ .Values.runtime_collector.server.image.repository }}:{{ .Values.runtime_collector.server.image.tag }}"
          imagePullPolicy: {{ .Values.runtime_collector.server.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.runtime_collector.server.service.port }}
              protocol: TCP
          livenessProbe:
            grpc:
              port: {{ .Values.runtime_collector.server.service.port }}
            initialDelaySeconds: {{ .Values.runtime_collector.server.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime_collector.server.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.runtime_collector.server.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.runtime_collector.server.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.runtime_collector.server.livenessProbe.failureThreshold }}
          readinessProbe:
            grpc:
              port: {{ .Values.runtime_collector.server.service.port }}
            initialDelaySeconds: {{ .Values.runtime_collector.server.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime_collector.server.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.runtime_collector.server.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.runtime_collector.server.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.runtime_collector.server.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.runtime_collector.server.resources | nindent 12 }}
          {{- if .Values.runtime_collector.server.envSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtime_collector.server.envSecret }}
          {{- end }}
          env:
            - name: SPRING_GRPC_SERVER_PORT
              value: {{ .Values.runtime_collector.server.service.port | quote }}
            - name: RUNTIME_COLLECTOR_CLICKHOUSE_ENDPOINT
              value: {{ include "runtime_collector.clickhouse.endpoint" . | quote }}
            - name: RUNTIME_COLLECTOR_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime_collector.clickhouse.secretName" . }}
                  key: CLICKHOUSE_USERNAME
            - name: RUNTIME_COLLECTOR_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime_collector.clickhouse.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            - name: RUNTIME_COLLECTOR_CLICKHOUSE_DATABASE
              value: {{ .Values.runtime_collector.clickhouse.database | quote }}
            {{- if include "runtime_collector.clickhouse.ca.mount" . }}
            - name: SSL_CERT_FILE
              value: /tmp/ca-certificates/ca.crt
            {{- end }}
            {{- with .Values.runtime_collector.server.extraEnvs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.general.readOnlyRootFilesystem (include "runtime_collector.internalTls.certEnabled" .) (include "runtime_collector.clickhouse.ca.mount" .) .Values.runtime_collector.server.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.general.readOnlyRootFilesystem }}
            ## Declared before the /tmp/* secret mounts so that the parent tmpfs is mounted first.
            - name: tmpfs
              mountPath: /tmp
            {{- end }}
            {{- if include "runtime_collector.internalTls.certEnabled" . }}
            - name: internal-cert
              mountPath: /tmp/certs/
              readOnly: true
            {{- end }}
            {{- if include "runtime_collector.clickhouse.ca.mount" . }}
            {{- include "runtime_collector.clickhouse.ca.volumeMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.runtime_collector.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.general.readOnlyRootFilesystem (include "runtime_collector.internalTls.certEnabled" .) (include "runtime_collector.clickhouse.ca.mount" .) .Values.runtime_collector.server.extraVolumes }}
      volumes:
        {{- if include "runtime_collector.internalTls.certEnabled" . }}
        - name: internal-cert
          secret:
            secretName: {{ include "runtime_collector.internalCertSecretName" . }}
        {{- end }}
        {{- if include "runtime_collector.clickhouse.ca.mount" . }}
        {{- include "runtime_collector.clickhouse.ca.volume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.general.readOnlyRootFilesystem }}
        - name: tmpfs
          emptyDir:
            sizeLimit: {{ .Values.general.readOnlyRootFilesystem_tmpfs_sizeLimit }}
        {{- end }}
        {{- with .Values.runtime_collector.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.general.tolerations }}
      tolerations:
        {{- toYaml .Values.general.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.runtime_collector.server.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.runtime_collector.server.nodeSelector | nindent 8 }}
      {{- else if .Values.general.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.general.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.runtime_collector.server.affinity }}
      affinity:
        {{- toYaml .Values.runtime_collector.server.affinity | nindent 8 }}
      {{- end }}
{{- end }}
