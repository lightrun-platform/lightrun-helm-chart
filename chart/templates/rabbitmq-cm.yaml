{{ if and .Values.general.mq.enabled .Values.general.mq.local -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lightrun-mq.name" . }}-config
data:
  enabled_plugins: |
    [rabbitmq_management{{ if .Values.general.mq.metrics }}, rabbitmq_prometheus{{ end }}].
  definitions.json: |
    {
      "vhosts":[
        {"name": "/"}
      ], 
      "policies": [
        {
          "vhost": "/",
          "name": "bi-queue-limiter-policy",
          "pattern": {{ .Values.general.mq.policy.queue_regex_pattern | quote }},
          "apply-to": "queues",
          "definition": {
            "max-length": {{ .Values.general.mq.policy.max_length }},
            "overflow": {{ .Values.general.mq.policy.overflow | quote }}
          },
          "priority": 2
        },    
        {
          "vhost": "/",
          "name": "total-memory-consumed-by-messages-in-queue-policy",
          "pattern": {{ .Values.general.mq.policy.queue_regex_pattern | quote }},
          "apply-to": "queues",
          "definition": {
            "max-length-bytes": {{ .Values.general.mq.policy.max_length_bytes | int }}
          },
          "priority": 1
        },
        {
          "vhost": "/",
          "name": "maximum-time-message-stay-in-queue-policy",
          "pattern": {{ .Values.general.mq.policy.queue_regex_pattern | quote }},
          "apply-to": "queues",
          "definition": {
            "message-ttl": {{ .Values.general.mq.policy.message_ttl | int }}
          },
          "priority": 0
        }
      ],
      {{- if .Values.runtime_collector.enabled }}
      "exchanges": [
        {
          "name": {{ .Values.general.mq.snapshot_events.exchange_name | quote }},
          "vhost": "/",
          "type": "fanout",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {
            "x-created-by": "lightrun-onprem-server-chart"
          }
        }
      ],
      {{- end }}
      "queues": [
        {{- $queue_names := .Values.general.mq.queue_names | default (list .Values.general.mq.queue_name) }}
        {{- $snapshot_queue_name := "" }}
        {{- if .Values.runtime_collector.enabled }}
        {{- $snapshot_queue_name = .Values.general.mq.snapshot_events.queue_name }}
        {{- end }}
        {{- $regular_queue_names := list }}
        {{- range $queue_names }}
        {{- if ne . $snapshot_queue_name }}
        {{- $regular_queue_names = append $regular_queue_names . }}
        {{- end }}
        {{- end }}
        {{- $last_index := sub (len $regular_queue_names) 1 }}
        {{- range $index, $queue_name := $regular_queue_names }}
        {
          "name": "{{ $queue_name }}.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-created-by": "lightrun-onprem-server-chart"
          }
        },
        {
          "name": {{ $queue_name | quote }},
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "",
            "x-dead-letter-routing-key": "{{ $queue_name }}.dlq",
            "x-queue-type": "quorum",
            "x-created-by": "lightrun-onprem-server-chart"
          }
        }{{ if or (not (eq $index $last_index)) $.Values.runtime_collector.enabled }},{{ end }}
        {{- end }}
        {{- if .Values.runtime_collector.enabled }}
        {
          "name": "{{ $snapshot_queue_name }}.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-message-ttl": {{ .Values.general.mq.snapshot_events.dlq.message_ttl | int }},
            "x-max-length": {{ .Values.general.mq.snapshot_events.dlq.max_length | int }},
            "x-overflow": {{ .Values.general.mq.snapshot_events.dlq.overflow | quote }},
            "x-max-length-bytes": {{ .Values.general.mq.snapshot_events.dlq.max_length_bytes | int }},
            "x-created-by": "lightrun-onprem-server-chart"
          }
        },
        {
          "name": {{ $snapshot_queue_name | quote }},
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "",
            "x-dead-letter-routing-key": "{{ $snapshot_queue_name }}.dlq",
            "x-queue-type": "quorum",
            "x-message-ttl": {{ .Values.general.mq.snapshot_events.main_queue.message_ttl | int }},
            "x-max-length": {{ .Values.general.mq.snapshot_events.main_queue.max_length | int }},
            "x-overflow": {{ .Values.general.mq.snapshot_events.main_queue.overflow | quote }},
            "x-max-length-bytes": {{ .Values.general.mq.snapshot_events.main_queue.max_length_bytes | int }},
            "x-created-by": "lightrun-onprem-server-chart"
          }
        }
        {{- end }}
      ]
      {{- if .Values.runtime_collector.enabled }},
      "bindings": [
        {
          "source": {{ .Values.general.mq.snapshot_events.exchange_name | quote }},
          "vhost": "/",
          "destination": {{ .Values.general.mq.snapshot_events.queue_name | quote }},
          "destination_type": "queue",
          "routing_key": "",
          "arguments": {}
        }
      ]
      {{- end }}
    }

  rabbitmq.conf: |
    queue_master_locator=min-masters
    vm_memory_high_watermark.relative=0.4
    total_memory_available_override_value = {{ include "lightrun-mq.toBytes" .Values.deployments.rabbitmq.resources.memory }}
    definitions.skip_if_unchanged = false
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/conf.d/definitions.json
    
    log.default.level = {{ .Values.deployments.rabbitmq.loglevel }}
    log.console.level = {{ .Values.deployments.rabbitmq.loglevel }}
    log.console = true
    log.file = false
    {{ if .Values.deployments.rabbitmq.useJsonLogFormat }}
    log.console.formatter = json
    {{ end -}}
    
    {{ if .Values.general.internal_tls.enabled -}}
    listeners.tcp = none

    listeners.ssl.default = {{ .Values.general.mq.port }}

    # ssl_options.cacertfile = /tmp/certs/ca.crt
    ssl_options.certfile   = /tmp/certs/tls.crt
    ssl_options.keyfile    = /tmp/certs/tls.key
    ssl_options.verify     = verify_none
    ssl_options.fail_if_no_peer_cert = false

    management.ssl.port       = 15672
    # management.ssl.cacertfile = /path/to/ca_certificate.pem
    management.ssl.certfile   = /tmp/certs/tls.crt
    management.ssl.keyfile    = /tmp/certs/tls.key
    {{ end -}}
{{ end }}
